components:
  schemas:
    User:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        id:
          type: integer
          description: Auto-generated unique identifier
          example: 1
        firstName:
          type: string
          description: User's first name
          example: "John"
        lastName:
          type: string
          description: User's last name
          example: "Doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john@example.com"
        age:
          type: integer
          description: User's age (optional)
          example: 25
        createdAt:
          type: string
          format: date-time
          description: Timestamp when user was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when user was last updated
    
    UserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          description: User's first name
          example: "John"
        lastName:
          type: string
          description: User's last name
          example: "Doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john@example.com"
        age:
          type: integer
          description: User's age (optional)
          example: 25
    
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details
    
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
        user:
          $ref: '#/components/schemas/User'
    
    UsersListResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
        count:
          type: integer
          description: Number of users returned
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
